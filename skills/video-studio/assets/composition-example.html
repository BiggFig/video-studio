<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=320,height=180"><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Studio;src:url('assets/font.ttf')}*{box-sizing:border-box}html,body{margin:0;width:320px;height:180px;overflow:hidden;background:#111}#root{width:100%;height:100%;position:relative;overflow:hidden;background:#111}#picture{position:absolute;inset:0}video{width:100%;height:100%;object-fit:cover}#caption{position:absolute;bottom:14px;width:100%;text-align:center}#label{font-family:Studio;color:white;font-size:18px;background:#111d;padding:6px 10px;display:inline-block;border-radius:6px}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="320" data-height="180" data-fps="30">
<div id="picture"><video id="take1" class="clip" src="assets/raw.mp4" data-start="0" data-duration="2" data-media-start="1" data-track-index="0" muted playsinline></video></div>
<audio id="speech1" src="assets/raw.mp4" data-start="0" data-duration="2" data-media-start="1" data-track-index="10"></audio>
<div id="caption" class="clip" data-start="0" data-duration="2" data-track-index="20"><span id="label">Video Studio</span></div>
</div><script>document.fonts.ready.then(()=>{const tl=gsap.timeline({paused:true});tl.fromTo('#label',{y:12,opacity:0},{y:0,opacity:1,duration:0.25},0);tl.to('#picture',{scale:1.04,duration:2,ease:'none'},0);window.__timelines=window.__timelines||{};window.__timelines.main=tl;});</script></body></html>
